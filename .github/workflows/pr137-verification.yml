name: pr137-verification

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  directional-chain-red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build
        run: npm run build -- --pretty false
      - name: Directional redirect regression
        run: node --test dist/tests/directional-chain-redirect.test.js

  catalog-end-turn-red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build
        run: npm run build -- --pretty false
      - name: Catalog end-turn regression
        run: node --test dist/tests/effect-runtime-catalog-errors.test.js

  source-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Create source archive
        run: >-
          tar --exclude=.git --exclude=assets --exclude='*.pdf'
          -czf /tmp/repository.tar.gz .
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: pr137-source-lite
          path: /tmp/repository.tar.gz
          if-no-files-found: error
          retention-days: 1
