name: pr137-verification

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  publish-final-wording:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          path: verification
      - name: Checkout PR #137 branch
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: agent/architecture-deepening-findings
          fetch-depth: 0
          path: target
      - name: Apply final wording patch
        working-directory: target
        run: |
          git apply --check ../verification/pr137-final-fixes.patch
          git apply ../verification/pr137-final-fixes.patch
          git diff --check
      - name: Commit final wording
        working-directory: target
        run: |
          git add docs/superpowers/plans/2026-07-23-pr-137-review-follow-up.md
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(review): finalize verification wording"
          git diff --check origin/master...HEAD
          test -z "$(git status --short)"
      - name: Push final wording
        working-directory: target
        run: git push origin HEAD:agent/architecture-deepening-findings
