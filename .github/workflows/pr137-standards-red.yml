name: pr137-standards-red

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  finding-red:
    name: ${{ matrix.case }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: lint-assertions-red
            pattern: invalid raw fixtures do not use unnecessary never assertions
            file: review-final-lint.test.js
          - case: catalog-source-red
            pattern: catalog entry execute owns source-kind validation
            file: review-final-ownership.test.js
          - case: catalog-mode-red
            pattern: catalog entry execute owns runtime-mode validation
            file: review-final-ownership.test.js
          - case: control-ledger-runtime-red
            pattern: replace_starting_card traverses the Control Ledger singleton zone
            file: review-final-ownership.test.js
          - case: catalog-caller-ownership-red
            pattern: effect runtime delegates ID, source, and mode policy to the catalog
            file: review-final-ownership.test.js
          - case: control-ledger-structure-red
            pattern: setup replacement does not enumerate physical player zones outside Control Ledger
            file: review-final-ownership.test.js
          - case: mayhem-typed-boundary-red
            pattern: Mayhem redraw handler keeps its decoded tuple type
            file: review-final-ownership.test.js
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build
        run: npm run build -- --pretty false
      - name: Reproduce ${{ matrix.case }}
        run: >-
          node --test
          --test-name-pattern "${{ matrix.pattern }}"
          "dist/tests/${{ matrix.file }}"
