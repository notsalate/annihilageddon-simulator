name: security

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: write

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@84a2b33c9f891494db6ebe02f2a55b19cdf38f25 # main
        with:
          extra_args: --results=verified,unknown

  publish-typed-effect-catalog:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/architecture-deepening-findings'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR 137 head
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: agent/architecture-deepening-findings
          fetch-depth: 0

      - name: Verify publication target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "agent/architecture-deepening-findings"
          test "$(git rev-parse HEAD^)" = "2e2664e6574a3129b61a0a651f2d39c5e64fd11e"

      - name: Apply verified patches
        shell: bash
        run: |
          set -euo pipefail
          test -f .scratch/agent-pr137-typed-effect.patch.gz.b64.part00
          test -f .scratch/agent-pr137-lint-fix.patch.gz.b64
          cat .scratch/agent-pr137-typed-effect.patch.gz.b64.part* \
            | base64 --decode \
            | gzip --decompress \
            > "${RUNNER_TEMP}/agent-pr137-typed-effect.patch"
          patch -p1 --forward --batch < "${RUNNER_TEMP}/agent-pr137-typed-effect.patch"
          base64 --decode .scratch/agent-pr137-lint-fix.patch.gz.b64 \
            | gzip --decompress \
            > "${RUNNER_TEMP}/agent-pr137-lint-fix.patch"
          patch -p1 --forward --batch < "${RUNNER_TEMP}/agent-pr137-lint-fix.patch"
          rm -f .scratch/agent-pr137-typed-effect.patch.gz.b64.part*
          rm -f .scratch/agent-pr137-lint-fix.patch.gz.b64

      - name: Verify changed paths
        shell: bash
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/expected-paths.txt" <<'EOF'
          .scratch/agent-pr137-lint-fix.patch.gz.b64
          .scratch/agent-pr137-typed-effect.patch.gz.b64.part00
          .scratch/agent-pr137-typed-effect.patch.gz.b64.part01
          .scratch/agent-pr137-typed-effect.patch.gz.b64.part02
          .scratch/agent-pr137-typed-effect.patch.gz.b64.part03
          .scratch/agent-pr137-typed-effect.patch.gz.b64.part04
          .scratch/agent-pr137-typed-effect.patch.gz.b64.part05
          .scratch/agent-pr137-typed-effect.patch.gz.b64.part06
          .scratch/agent-pr137-typed-effect.patch.gz.b64.part07
          docs/superpowers/specs/2026-07-20-engine-architecture-deepening-design.md
          scripts/check-engine-typed-access.mjs
          scripts/check-engine-unknown-arrays.mjs
          src/engine/AGENTS.md
          src/engine/data.ts
          src/engine/effect-runtime-registry.ts
          src/engine/effect-runtime.ts
          src/engine/effective-values.ts
          src/engine/runtime-effect-decoder.ts
          src/engine/runtime-effect.ts
          tests/action-loop.test.ts
          tests/attack-defense-snapshot.test.ts
          tests/attack-defense.test.ts
          tests/best-move-analysis.test.ts
          tests/effect-runtime-applicability.test.ts
          tests/effect-runtime-catalog-types.test.ts
          tests/engine-guards.test.ts
          tests/helpers/defense-fixtures.ts
          tests/helpers/with-temporary-effect-runtime-handler.ts
          tests/market-flow-terminal.test.ts
          tests/run-tests.ts
          tests/runtime-regression.test.ts
          tests/setup-effects.test.ts
          tests/trigger-dispatch.test.ts
          tests/validation.test.ts
          EOF
          git add --intent-to-add .
          git diff --name-only HEAD | sort > "${RUNNER_TEMP}/actual-paths.txt"
          diff -u "${RUNNER_TEMP}/expected-paths.txt" "${RUNNER_TEMP}/actual-paths.txt"
          git diff --check HEAD
          git diff --quiet HEAD -- package.json package-lock.json
          git diff --quiet HEAD -- .github/workflows
          git reset

      - name: Install dependencies
        run: npm ci

      - name: Verify implementation
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck:strictest
          npm run lint
          npm run check:ts-suppressions
          npm run check:engine-unknown-arrays
          npm run check:engine-event-recording
          npm run check:engine-typed-access
          npm run check:json-parse-assertions
          npm test
          npm run report:card-runtime-clusters

      - name: Create verified Git Data commit object
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add --intent-to-add .
          git diff --name-only HEAD > "${RUNNER_TEMP}/changed-paths.txt"
          git reset
          python3 - <<'PY'
          import base64
          import json
          import os
          import pathlib
          import subprocess
          import urllib.error
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          runner_temp = pathlib.Path(os.environ["RUNNER_TEMP"])

          def git(*args: str) -> str:
              return subprocess.check_output(["git", *args], text=True).strip()

          def post(endpoint: str, payload: dict[str, object]) -> dict[str, object]:
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/{endpoint}",
                  data=json.dumps(payload).encode("utf-8"),
                  method="POST",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "pr137-typed-effect-publisher",
                  },
              )
              try:
                  with urllib.request.urlopen(request) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  print(error.read().decode("utf-8"), flush=True)
                  raise

          parent_sha = git("rev-parse", "HEAD")
          base_tree_sha = git("rev-parse", f"{parent_sha}^{{tree}}")
          paths = (runner_temp / "changed-paths.txt").read_text(encoding="utf-8").splitlines()
          tree: list[dict[str, object]] = []

          for path_text in paths:
              path = pathlib.Path(path_text)
              if path.exists():
                  encoded = base64.b64encode(path.read_bytes()).decode("ascii")
                  blob = post("git/blobs", {"content": encoded, "encoding": "base64"})
                  mode_output = subprocess.check_output(
                      ["git", "ls-files", "-s", "--", path_text], text=True
                  ).strip()
                  mode = mode_output.split(maxsplit=1)[0] if mode_output else "100644"
                  tree.append(
                      {
                          "path": path_text,
                          "mode": mode,
                          "type": "blob",
                          "sha": blob["sha"],
                      }
                  )
                  print(f"blob {path_text} {blob['sha']}", flush=True)
              else:
                  tree.append(
                      {
                          "path": path_text,
                          "mode": "100644",
                          "type": "blob",
                          "sha": None,
                      }
                  )
                  print(f"delete {path_text}", flush=True)

          new_tree = post("git/trees", {"base_tree": base_tree_sha, "tree": tree})
          commit = post(
              "git/commits",
              {
                  "message": "refactor(engine): сделать каталог эффектов исчерпывающим",
                  "tree": new_tree["sha"],
                  "parents": [parent_sha],
              },
          )
          commit_sha = str(commit["sha"])
          (runner_temp / "pr137-final-commit-sha.txt").write_text(
              f"{commit_sha}\n", encoding="utf-8"
          )
          print(f"verified commit {commit_sha}", flush=True)
          PY

      - name: Upload verified commit SHA
        uses: actions/upload-artifact@v4
        with:
          name: pr137-verified-commit-sha
          path: ${{ runner.temp }}/pr137-final-commit-sha.txt
          if-no-files-found: error
          retention-days: 1
