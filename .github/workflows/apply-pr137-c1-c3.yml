name: apply-pr137-c1-c3

on:
  pull_request:
    branches:
      - agent/architecture-deepening-findings
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/tmp-apply-pr137-c1-c3'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: agent/tmp-apply-pr137-c1-c3
          path: staging
          fetch-depth: 1
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/architecture-deepening-findings
          path: target
          fetch-depth: 0
      - name: Decode patch series
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/patches"
          python - <<'PY'
          import base64
          import gzip
          import os
          from pathlib import Path

          source_dir = Path("staging/.github/patches")
          target_dir = Path(os.environ["RUNNER_TEMP"]) / "patches"
          files = [
              ("0001-refactor-control.patch.gz.b64", "0001-c1.patch"),
              ("0002-refactor-control.patch.gz.b64", "0002-c2.patch"),
              ("0003-refactor-control-consumers-Control-Ledger.patch.gz.b64", "0003-c3.patch"),
          ]
          for source_name, target_name in files:
              source = source_dir / source_name
              encoded = "".join(source.read_text(encoding="utf-8").split())
              compressed = base64.b64decode(encoded, validate=True)
              decoded = gzip.decompress(compressed)
              target = target_dir / target_name
              target.write_bytes(decoded)
              if not decoded.startswith(b"From "):
                  raise SystemExit(f"{source_name} is not a git format-patch")
              print(f"decoded {source_name}: {len(decoded)} bytes")
          PY
      - name: Apply commits
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git am "${RUNNER_TEMP}/patches/0001-c1.patch" \
                 "${RUNNER_TEMP}/patches/0002-c2.patch" \
                 "${RUNNER_TEMP}/patches/0003-c3.patch"
      - name: Install dependencies
        working-directory: target
        run: npm ci
      - name: Verify commit series
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npm run report:card-runtime-clusters
          git diff --check origin/master...HEAD
      - name: Publish commits to draft PR branch
        working-directory: target
        shell: bash
        env:
          EXPECTED_REMOTE_HEAD: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git push \
            --force-with-lease=refs/heads/agent/architecture-deepening-findings:${EXPECTED_REMOTE_HEAD} \
            origin HEAD:refs/heads/agent/architecture-deepening-findings
