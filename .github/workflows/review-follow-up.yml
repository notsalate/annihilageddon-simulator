name: review-follow-up

on:
  push:
    branches:
      - agent/architecture-deepening-findings
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -- --pretty false
      - name: action-loop diagnostics
        shell: bash
        run: |
          set +e
          node --test dist/tests/action-loop.test.js > action-loop.log 2>&1
          status=$?
          tail -n 180 action-loop.log
          exit $status
