name: review-follow-up

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  collect-failures:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/architecture-deepening-findings
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -- --pretty false
      - name: Run all suites and collect failures
        id: collect
        continue-on-error: true
        shell: bash
        run: |
          set +e
          : > failed-suites.txt
          for suite in \
            common.test.js id-types.test.js json-parse-assertions.test.js rng.test.js \
            game-state-fork.test.js setup.test.js setup-effects.test.js action-loop.test.js \
            effective-values.test.js control-ledger.test.js trigger-dispatch.test.js simulation.test.js \
            simulation-legal-actions.test.js debug-trace.test.js invariants.test.js simulation-menu.test.js \
            runtime-regression.test.js validation.test.js draft-validation.test.js draft-generator.test.js \
            import-completeness.test.js runtime-coverage-inventory.test.js runtime-image-metadata.test.js \
            card-runtime-clusters.test.js engine-guards.test.js effect-choice-routing.test.js \
            best-move-analysis.test.js best-move-cli.test.js effect-runtime-applicability.test.js \
            attack-resolution.test.js attack-defense.test.js defense-choice.test.js review-findings.test.js \
            helpers/game-scenario.test.js
          do
            safe_name=${suite//\//_}
            if ! node --test "dist/tests/$suite" > "$safe_name.log" 2>&1; then
              echo "$suite" >> failed-suites.txt
              echo "===== $suite =====" >> failure-details.txt
              tail -n 120 "$safe_name.log" >> failure-details.txt
            fi
          done
          test ! -s failed-suites.txt
      - name: Upload test failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-test-failures
          path: |
            failed-suites.txt
            failure-details.txt
          if-no-files-found: ignore
      - name: Fail if suites failed
        if: steps.collect.outcome == 'failure'
        run: exit 1
