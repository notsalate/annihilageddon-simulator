name: review-follow-up

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/architecture-deepening-findings
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -- --pretty false
      - run: node --test dist/tests/action-loop.test.js
      - run: node --test dist/tests/control-ledger.test.js
      - run: node --test dist/tests/trigger-dispatch.test.js
      - run: node --test dist/tests/attack-resolution.test.js
      - run: node --test dist/tests/attack-defense.test.js
      - run: node --test dist/tests/defense-choice.test.js
      - run: node --test dist/tests/review-findings.test.js
