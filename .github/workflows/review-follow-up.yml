name: review-follow-up

on:
  push:
    branches:
      - agent/architecture-deepening-findings
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -- --pretty false
      - name: effective-values
        run: node --test dist/tests/effective-values.test.js
      - name: action-loop
        run: node --test dist/tests/action-loop.test.js
      - name: control-ledger
        run: node --test dist/tests/control-ledger.test.js
      - name: trigger-dispatch
        run: node --test dist/tests/trigger-dispatch.test.js
      - name: attack-resolution
        run: node --test dist/tests/attack-resolution.test.js
      - name: attack-defense
        run: node --test dist/tests/attack-defense.test.js
      - name: defense-choice
        run: node --test dist/tests/defense-choice.test.js
      - name: runtime-regression
        run: node --test dist/tests/runtime-regression.test.js
      - name: review-findings
        run: node --test dist/tests/review-findings.test.js
