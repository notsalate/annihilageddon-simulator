name: review-follow-up

on:
  push:
    branches:
      - agent/architecture-deepening-findings
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck:strictest
      - run: npm run lint
      - run: npm run check:ts-suppressions
      - run: npm run check:engine-unknown-arrays
      - run: npm run check:engine-event-recording
      - run: npm run check:engine-typed-access
      - run: npm run check:json-parse-assertions
      - run: npm run test
      - run: npm run report:card-runtime-clusters
      - run: git diff --check origin/master...HEAD
