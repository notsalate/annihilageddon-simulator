name: supply-chain

on:
  pull_request:
  push:
    branches: [main, dev]
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

jobs:
  osv:
    permissions:
      actions: read
      security-events: write
      contents: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
    with:
      scan-args: |-
        --recursive
        ./
