name: export-c1-c3-patches

on:
  pull_request:
    branches:
      - agent/architecture-deepening-findings
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  export:
    if: github.event.pull_request.head.ref == 'agent/tmp-apply-pr137-c1-c3'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: agent/tmp-apply-pr137-c1-c3
          fetch-depth: 1
      - name: Record patch sizes
        shell: bash
        run: |
          set -euo pipefail
          wc -c .github/patches/*.patch.gz.b64
          sha256sum .github/patches/*.patch.gz.b64
      - name: Upload stored patches
        uses: actions/upload-artifact@v4
        with:
          name: c1-c3-stored-patches
          path: .github/patches/*.patch.gz.b64
          if-no-files-found: error
          retention-days: 1
