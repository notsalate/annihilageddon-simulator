name: verify-pr137-final-head

on:
  pull_request:
    branches:
      - agent/architecture-deepening-findings
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  verify:
    if: github.event.pull_request.head.ref == 'agent/tmp-export-pr137-20260720'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR 137 head
        uses: actions/checkout@v4
        with:
          ref: agent/architecture-deepening-findings
          fetch-depth: 0
      - name: Verify expected final head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "be0cefa9bc53b17ee91466784196ba4088098e37"
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Audit dependencies
        run: npm audit
      - name: Run complete project gate
        run: npm run check
      - name: Report runtime clusters
        run: npm run report:card-runtime-clusters
      - name: Verify diffs and clean tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git diff --check origin/master...HEAD
          git diff --check
          test -z "$(git status --porcelain)"
