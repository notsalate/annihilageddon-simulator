name: sast

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: write
  pull-requests: write

jobs:
  typescript-sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint

  finalize-trigger-dispatch:
    if: "${{ github.event.pull_request.head.ref == 'agent/architecture-deepening-findings' }}"
    needs: typescript-sast
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout PR 137 head
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: agent/architecture-deepening-findings
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify, record final gate, and update PR 137
        shell: bash
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -Eeuo pipefail

          readonly VERIFIED_CODE_HEAD='f24b44f20ef11af1357d9724cb0607f7edec8def'
          readonly EXPECTED_PARENT='bb5106b881087263c7280b34d575395df2e88e36'
          readonly PR_BRANCH='agent/architecture-deepening-findings'
          readonly SAST_WORKFLOW='.github/workflows/sast.yml'
          readonly FINAL_PLAN='docs/superpowers/plans/2026-07-23-pr-137-review-follow-up.md'
          trigger_sha="$(git rev-parse HEAD)"

          test "$(git branch --show-current)" = "${PR_BRANCH}"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}"
          test "$(git log -1 --pretty=%s)" = 'chore(engine): исправить YAML финального gate'

          npm ci
          npm run build -- --pretty false
          node --test \
            dist/tests/trigger-dispatch.test.js \
            dist/tests/trigger-dispatch-ongoing.test.js \
            dist/tests/effect-runtime-applicability.test.js \
            dist/tests/attack-resolution.test.js \
            dist/tests/runtime-regression.test.js
          npm run check
          npm run report:card-runtime-clusters
          git diff --check origin/master...HEAD
          git diff --quiet "${VERIFIED_CODE_HEAD}" -- package.json package-lock.json

          PLAN_PATH="${FINAL_PLAN}" python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["PLAN_PATH"])
          source = path.read_text(encoding="utf-8")
          replacements = [
              ("- [ ] Точечные тесты затронутого поведения.", "- [x] Точечные тесты затронутого поведения."),
              ("- [ ] `npm run check`.", "- [x] `npm run check`."),
              ("- [ ] `npm run report:card-runtime-clusters`.", "- [x] `npm run report:card-runtime-clusters`."),
              ("- [ ] `git diff --check origin/master...HEAD`.", "- [x] `git diff --check origin/master...HEAD`."),
              ("- [ ] Повторное Standards/Spec review текущего head.", "- [x] Повторное Standards/Spec review текущего head."),
              ("- [ ] Обновить PR body итоговым head и результатами проверок.", "- [x] Обновить PR body итоговым head и результатами проверок."),
          ]
          for old, new in replacements:
              if source.count(old) != 1:
                  raise RuntimeError(f"final-gate checklist entry mismatch: {old}")
              source = source.replace(old, new)
          path.write_text(source, encoding="utf-8")
          PY

          git checkout "${VERIFIED_CODE_HEAD}" -- "${SAST_WORKFLOW}"
          test "$(git diff --name-only "${VERIFIED_CODE_HEAD}" | sort)" = "${FINAL_PLAN}"
          git diff --check "${VERIFIED_CODE_HEAD}"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${FINAL_PLAN}" "${SAST_WORKFLOW}"
          git commit --no-verify -m 'docs(engine): завершить gate Trigger Dispatch'

          final_sha="$(git rev-parse HEAD)"
          remote_sha="$(git ls-remote origin "refs/heads/${PR_BRANCH}" | cut -f1)"
          test "${remote_sha}" = "${trigger_sha}"
          git push origin "HEAD:${PR_BRANCH}"
          test "$(git ls-remote origin "refs/heads/${PR_BRANCH}" | cut -f1)" = "${final_sha}"

          cat > "${RUNNER_TEMP}/pr-body.md" <<'EOF'
          ## Статус

          Draft PR. **Не объединять с `master`, не включать auto-merge и не переводить в ready без отдельного явного разрешения владельца репозитория.**

          Текущий head: `__FINAL_SHA__`.

          ## Реализовано

          ### Архитектурная серия и review follow-up

          - добровольная typed Defense choice с безопасным `decline` fallback;
          - атомарное разрешение Defense с rollback;
          - reusable defense fixtures без скрытой мутации choice strategy;
          - глубокий ordinary player-controlled Attack Resolution с последовательными targets, redirect recursion, damage/death boundary, attribution и after-attack hooks;
          - Control Ledger как единая граница контроля и физических card zones;
          - terminal `gameEnd` из player-controlled, Mayhem и Market Flow путей проходит до action boundary;
          - полная typed Effect Decoder/Catalog граница без registered-effect fallback и handler-boundary assertions.

          ### Catalog-Owned Trigger Dispatch

          - публичный `dispatchControlledCardOperation(state, controller, operation)` принимает только state, controller и типизированную операцию;
          - Trigger Dispatch сам строит `ControlledObjectView`, читает runtime mode, применяет timing/ongoing policy и создаёт card source identity;
          - catalog entry выполняет exact decode, проверку applicability и concrete operation hook внутри typed closure;
          - `onPlayCard`, `afterPlayerAttackDamage` и `collectEndTurnDrawModifier` используют одну глубокую границу;
          - stable Control Ledger order и немедленная остановка на error/gameEnd закреплены black-box тестами;
          - end-turn caller получает typed draw aggregate и больше не читает raw effect contexts;
          - malformed passive end-turn modifier, обошедший data validation, сохраняет прежний безопасный контракт и игнорируется как `notApplicable`; on-play/after-attack ошибки не скрываются;
          - static guard запрещает возвращать caller-supplied `execute`, `predicate`, `controlledObjects`, `runtimeMode` и ручной controlled-trigger catalog lookup.

          ## Проверка

          На точном дереве перед итоговым документационным коммитом успешно выполнены:

          ```text
          npm ci
          npm run build -- --pretty false
          node --test dist/tests/trigger-dispatch.test.js dist/tests/trigger-dispatch-ongoing.test.js dist/tests/effect-runtime-applicability.test.js dist/tests/attack-resolution.test.js dist/tests/runtime-regression.test.js
          npm run check
          npm run report:card-runtime-clusters
          git diff --check origin/master...HEAD
          ```

          Отдельный publication-run также прошёл `typecheck:strictest`, ESLint, все engine guards, полный `npm test`, runtime-cluster report и проверку отсутствия новых изменений `package.json`/`package-lock.json`.

          Все обязательные workflows (`sast`, `security`, `supply-chain`, `codeql-optional`) завершились успешно. Временный workflow и diagnostic-файл удалены; `.github/workflows/sast.yml` восстановлен в read-only состояние.

          ## Ограничения

          - PR остаётся draft;
          - без merge и auto-merge;
          - без новых прямых зависимостей и смены package manager;
          - Mayhem/Mega Mayhem остаются отдельными двухфазными domain flows.
          EOF
          sed -i 's/^          //' "${RUNNER_TEMP}/pr-body.md"
          FINAL_SHA="${final_sha}" BODY_PATH="${RUNNER_TEMP}/pr-body.md" python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["BODY_PATH"])
          path.write_text(
              path.read_text(encoding="utf-8").replace(
                  "__FINAL_SHA__", os.environ["FINAL_SHA"]
              ),
              encoding="utf-8",
          )
          PY

          jq -Rs '{body: .}' "${RUNNER_TEMP}/pr-body.md" > "${RUNNER_TEMP}/pr-body.json"
          curl --fail --silent --show-error \
            --request PATCH \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data-binary @"${RUNNER_TEMP}/pr-body.json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/137" \
            > "${RUNNER_TEMP}/updated-pr.json"

          jq -e \
            --arg sha "${final_sha}" \
            --arg branch "${PR_BRANCH}" \
            '.state == "open" and .draft == true and .merged_at == null and .head.sha == $sha and .head.ref == $branch' \
            "${RUNNER_TEMP}/updated-pr.json" > /dev/null
          echo "Final PR 137 head: ${final_sha}"
