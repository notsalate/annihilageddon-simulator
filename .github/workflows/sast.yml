name: sast

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  actions: read
  contents: read

jobs:
  typescript-sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint

  print-trigger-dispatch-diagnostic:
    if: "${{ github.event.pull_request.head.ref == 'agent/architecture-deepening-findings' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print failure signatures from publisher job
        shell: bash
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -euo pipefail
          curl --location --fail --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/89786804249/logs" \
            --output "${RUNNER_TEMP}/publisher.log"
          if file "${RUNNER_TEMP}/publisher.log" | grep -qi 'Zip archive'; then
            unzip -p "${RUNNER_TEMP}/publisher.log" > "${RUNNER_TEMP}/publisher.txt"
          else
            cp "${RUNNER_TEMP}/publisher.log" "${RUNNER_TEMP}/publisher.txt"
          fi
          echo '=== FAILURE SIGNATURES ==='
          grep -E 'error TS|RuntimeError|Error:|not ok|FAILED|Trigger Dispatch transport failed|npm ERR|##\[error\]' "${RUNNER_TEMP}/publisher.txt" | tail -n 80 || true
          echo '=== FINAL 80 LINES ==='
          tail -n 80 "${RUNNER_TEMP}/publisher.txt"
