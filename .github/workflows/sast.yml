name: sast

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  typescript-sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint

  opengrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Opengrep placeholder
        run: |
          echo "Install Opengrep from official current stable docs, then run:"
          echo "opengrep --config .repo-safety/opengrep ."
          echo "This workflow is intentionally non-installing to avoid unpinned installer snippets."
