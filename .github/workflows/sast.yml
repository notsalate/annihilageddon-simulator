name: sast

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  actions: read
  contents: write

jobs:
  typescript-sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint

  extract-trigger-dispatch-diagnostic:
    if: "${{ github.event.pull_request.head.ref == 'agent/architecture-deepening-findings' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR 137 head
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: agent/architecture-deepening-findings
          fetch-depth: 0

      - name: Extract failed publisher log and clean diagnostic transport
        shell: bash
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -euo pipefail

          readonly ORIGINAL_HEAD='1475578adb63b704f0cc10b822a70e66667a4e51'
          readonly EXPECTED_PARENT='44ac237b1739e422cde663d6adcf455fb411886a'
          readonly PR_BRANCH='agent/architecture-deepening-findings'
          readonly SAST_WORKFLOW='.github/workflows/sast.yml'
          readonly DIAGNOSTIC='pr137-trigger-dispatch-diagnostic.log'
          readonly FAILED_JOB_ID='89786804249'
          trigger_sha="$(git rev-parse HEAD)"

          test "$(git branch --show-current)" = "${PR_BRANCH}"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}"
          test "$(git log -1 --pretty=%s)" = 'chore(engine): извлечь диагностику Trigger Dispatch'

          curl --location --fail --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/${FAILED_JOB_ID}/logs" \
            --output "${RUNNER_TEMP}/failed-job.log"

          if file "${RUNNER_TEMP}/failed-job.log" | grep -qi 'Zip archive'; then
            unzip -p "${RUNNER_TEMP}/failed-job.log" > "${RUNNER_TEMP}/failed-job.txt"
          else
            cp "${RUNNER_TEMP}/failed-job.log" "${RUNNER_TEMP}/failed-job.txt"
          fi

          {
            echo "source_job_id=${FAILED_JOB_ID}"
            echo "trigger_sha=${trigger_sha}"
            echo
            echo '--- tail of failed publisher log ---'
            tail -n 1800 "${RUNNER_TEMP}/failed-job.txt"
          } > "${DIAGNOSTIC}"

          git checkout "${ORIGINAL_HEAD}" -- "${SAST_WORKFLOW}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${SAST_WORKFLOW}" "${DIAGNOSTIC}"
          git commit --no-verify -m 'chore(engine): сохранить диагностику Trigger Dispatch'

          remote_sha="$(git ls-remote origin "refs/heads/${PR_BRANCH}" | cut -f1)"
          test "${remote_sha}" = "${trigger_sha}"
          git push origin "HEAD:${PR_BRANCH}"
