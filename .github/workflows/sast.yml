name: sast

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: write

jobs:
  typescript-sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint

  publish-trigger-dispatch:
    if: "${{ github.event.pull_request.head.ref == 'agent/architecture-deepening-findings' }}"
    needs: typescript-sast
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout PR 137 head
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: agent/architecture-deepening-findings
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply, verify, and publish catalog-owned Trigger Dispatch
        shell: bash
        run: |
          set -Eeuo pipefail

          readonly ORIGINAL_HEAD='1475578adb63b704f0cc10b822a70e66667a4e51'
          readonly EXPECTED_PARENT='6111c539ea752f2c05170eb6e30d688d9e83d0be'
          readonly PR_BRANCH='agent/architecture-deepening-findings'
          readonly TRANSPORT='.scratch/agent-pr137-trigger-dispatch.py.gz.b64'
          readonly STANDALONE_WORKFLOW='.github/workflows/apply-pr137-trigger-dispatch.yml'
          readonly SAST_WORKFLOW='.github/workflows/sast.yml'
          readonly DIAGNOSTIC='.scratch/pr137-trigger-dispatch-diagnostic.log'
          readonly LOG_FILE="${RUNNER_TEMP}/apply-pr137-trigger-dispatch.log"
          current_step='bootstrap'
          trigger_sha="$(git rev-parse HEAD)"

          exec > >(tee -a "${LOG_FILE}") 2>&1

          publish_diagnostic() {
            local status=$?
            trap - EXIT
            if [[ ${status} -eq 0 ]]; then
              return 0
            fi

            set +e
            echo "Trigger Dispatch transport failed in step: ${current_step} (exit ${status})"
            git reset --hard "${trigger_sha}"
            git checkout "${ORIGINAL_HEAD}" -- "${SAST_WORKFLOW}"
            rm -f "${TRANSPORT}" "${STANDALONE_WORKFLOW}"
            mkdir -p .scratch
            {
              echo "step=${current_step}"
              echo "exit_status=${status}"
              echo "trigger_sha=${trigger_sha}"
              echo "branch=${PR_BRANCH}"
              echo
              echo '--- tail of workflow log ---'
              tail -n 3500 "${LOG_FILE}"
            } > "${DIAGNOSTIC}"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A -- \
              "${SAST_WORKFLOW}" \
              "${STANDALONE_WORKFLOW}" \
              "${TRANSPORT}" \
              "${DIAGNOSTIC}"
            git commit --no-verify -m 'chore(engine): записать диагностику Trigger Dispatch'
            git push origin "HEAD:${PR_BRANCH}"
            exit "${status}"
          }
          trap publish_diagnostic EXIT

          current_step='verify publication target'
          test "$(git branch --show-current)" = "${PR_BRANCH}"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}"
          test "$(git log -1 --pretty=%s)" = 'chore(engine): подключить PR transport Trigger Dispatch'
          test -f "${TRANSPORT}"
          test "$(sha256sum "${TRANSPORT}" | cut -d' ' -f1)" = '48e24aa66d12b774ec82f5b8b47eee5c204e717dc648ffeb96d03051659843b1'

          current_step='install dependencies'
          npm ci

          current_step='decode deterministic transport'
          base64 --decode "${TRANSPORT}" \
            | gzip --decompress \
            > "${RUNNER_TEMP}/apply-trigger-dispatch.py"
          test "$(sha256sum "${RUNNER_TEMP}/apply-trigger-dispatch.py" | cut -d' ' -f1)" = '1762c679f372bb249a27c6caa02501a58c5e1bacd943786498f500f4e4a7f1d1'
          python3 -m py_compile "${RUNNER_TEMP}/apply-trigger-dispatch.py"

          current_step='prove RED'
          python3 "${RUNNER_TEMP}/apply-trigger-dispatch.py" tests
          set +e
          npm run build -- --pretty false > "${RUNNER_TEMP}/trigger-dispatch-red.log" 2>&1
          red_status=$?
          set -e
          cat "${RUNNER_TEMP}/trigger-dispatch-red.log"
          test "${red_status}" -ne 0
          grep -q 'dispatchControlledCardOperation' "${RUNNER_TEMP}/trigger-dispatch-red.log"

          current_step='implement and focused GREEN'
          python3 "${RUNNER_TEMP}/apply-trigger-dispatch.py" implementation
          npm run build -- --pretty false
          node --test \
            dist/tests/trigger-dispatch.test.js \
            dist/tests/trigger-dispatch-ongoing.test.js \
            dist/tests/effect-runtime-applicability.test.js \
            dist/tests/attack-resolution.test.js

          current_step='synchronize documentation'
          python3 "${RUNNER_TEMP}/apply-trigger-dispatch.py" docs

          current_step='verify changed paths'
          cat > "${RUNNER_TEMP}/expected-paths.txt" <<'EOF'
          .github/workflows/apply-pr137-trigger-dispatch.yml
          .github/workflows/sast.yml
          .scratch/agent-pr137-trigger-dispatch.py.gz.b64
          docs/superpowers/plans/2026-07-23-pr-137-review-follow-up.md
          docs/superpowers/specs/2026-07-20-engine-architecture-deepening-design.md
          scripts/check-engine-typed-access.mjs
          src/engine/AGENTS.md
          src/engine/effect-runtime-registry.ts
          src/engine/effect-runtime.ts
          src/engine/trigger-dispatch.ts
          tests/trigger-dispatch.test.ts
          EOF
          git diff --name-only "${ORIGINAL_HEAD}" | sort > "${RUNNER_TEMP}/actual-paths.txt"
          diff -u "${RUNNER_TEMP}/expected-paths.txt" "${RUNNER_TEMP}/actual-paths.txt"
          git diff --check "${ORIGINAL_HEAD}"
          git diff --quiet "${ORIGINAL_HEAD}" -- package.json package-lock.json

          current_step='full verification gate'
          npm run typecheck:strictest
          npm run lint
          npm run check:ts-suppressions
          npm run check:engine-unknown-arrays
          npm run check:engine-event-recording
          npm run check:engine-typed-access
          npm run check:json-parse-assertions
          npm test
          npm run report:card-runtime-clusters
          git diff --check "${ORIGINAL_HEAD}"

          current_step='commit verified changes'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add tests/trigger-dispatch.test.ts
          git commit --no-verify -m 'test(engine): зафиксировать глубокий контракт Trigger Dispatch'

          git add \
            scripts/check-engine-typed-access.mjs \
            src/engine/effect-runtime-registry.ts \
            src/engine/effect-runtime.ts \
            src/engine/trigger-dispatch.ts
          git commit --no-verify -m 'refactor(engine): перенести catalog execution в Trigger Dispatch'

          git add \
            docs/superpowers/plans/2026-07-23-pr-137-review-follow-up.md \
            docs/superpowers/specs/2026-07-20-engine-architecture-deepening-design.md \
            src/engine/AGENTS.md
          git commit --no-verify -m 'docs(engine): обновить ownership Trigger Dispatch'

          git checkout "${ORIGINAL_HEAD}" -- "${SAST_WORKFLOW}"
          rm -f "${TRANSPORT}" "${STANDALONE_WORKFLOW}" "${DIAGNOSTIC}"
          git add -A -- \
            "${SAST_WORKFLOW}" \
            "${TRANSPORT}" \
            "${STANDALONE_WORKFLOW}"
          git commit --no-verify -m 'chore(engine): удалить временный transport Trigger Dispatch'

          current_step='verify and push only PR 137 head branch'
          test ! -e "${TRANSPORT}"
          test ! -e "${STANDALONE_WORKFLOW}"
          test ! -e "${DIAGNOSTIC}"
          test -z "$(git status --short)"
          git diff --check "${ORIGINAL_HEAD}..HEAD"
          git diff --quiet "${ORIGINAL_HEAD}..HEAD" -- package.json package-lock.json
          remote_sha="$(git ls-remote origin "refs/heads/${PR_BRANCH}" | cut -f1)"
          test "${remote_sha}" = "${trigger_sha}"
          git push origin "HEAD:${PR_BRANCH}"
